<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proof Review — Rocket City Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0a1628;--navy-mid:#132040;--red:#c8102e;--cream:#f5f0e8;--gold:#d4a843;--green:#1a7a3a;--border:rgba(10,22,40,0.1);--font-display:'Bebas Neue',sans-serif;--font-cond:'Barlow Condensed',sans-serif;--font-body:'Barlow',sans-serif;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-body);background:var(--cream);color:var(--navy);min-height:100vh}
  .topbar{background:var(--navy);border-bottom:3px solid var(--red);padding:0 24px;height:62px;display:flex;align-items:center;gap:12px}
  .topbar-icon{width:32px;height:32px;background:var(--red);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .topbar-brand{font-family:var(--font-display);font-size:18px;color:#f5f0e8;letter-spacing:2px}
  .container{max-width:820px;margin:0 auto;padding:40px 24px}
  .card{background:#fff;border-radius:12px;border:1.5px solid var(--border);overflow:hidden;margin-bottom:24px}
  .card-header{background:var(--navy);padding:22px 28px}
  .card-title{font-family:var(--font-display);font-size:26px;color:#f5f0e8;letter-spacing:2px}
  .card-sub{font-size:14px;color:rgba(245,240,232,0.55);margin-top:4px}
  .card-body{padding:28px}
  .order-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(200,16,46,0.06);border:1.5px solid rgba(200,16,46,0.2);border-radius:6px;padding:8px 14px;margin-bottom:20px}
  .order-num{font-family:var(--font-display);font-size:22px;color:var(--red);letter-spacing:2px}
  .notes-box{background:#fffbe6;border-left:4px solid var(--gold);padding:14px 18px;border-radius:0 6px 6px 0;margin-bottom:20px;font-size:14px;color:rgba(10,22,40,0.75);line-height:1.7}
  .notes-title{font-family:var(--font-cond);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(10,22,40,0.45);margin-bottom:6px}
  .preview-area{background:rgba(10,22,40,0.03);border:2px dashed rgba(10,22,40,0.15);border-radius:10px;padding:32px;text-align:center;margin-bottom:20px;position:relative}
  .preview-badge{position:absolute;top:12px;right:12px;background:rgba(10,22,40,0.6);color:rgba(255,255,255,0.8);font-family:var(--font-cond);font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:4px}
  .preview-img{max-width:100%;max-height:500px;border-radius:6px;box-shadow:0 4px 24px rgba(10,22,40,0.15)}
  .preview-empty-icon{font-size:48px;opacity:0.25;margin-bottom:10px}
  .preview-empty-text{font-family:var(--font-cond);font-size:15px;color:rgba(10,22,40,0.4);text-transform:uppercase;letter-spacing:1px}
  .items-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:24px}
  .item-card{background:rgba(10,22,40,0.03);border-radius:8px;padding:14px 16px;border:1px solid var(--border)}
  .item-name{font-weight:600;font-size:15px;margin-bottom:4px}
  .item-detail{font-size:13px;color:rgba(10,22,40,0.55);line-height:1.65}
  .divider{border:none;border-top:1.5px solid var(--border);margin:24px 0}
  .decision-section{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .decision-card{border-radius:10px;padding:24px;border:2px solid transparent;transition:all 0.2s;cursor:pointer}
  .decision-card.approve-card{background:rgba(26,122,58,0.06);border-color:rgba(26,122,58,0.2)}
  .decision-card.reject-card{background:rgba(200,16,46,0.05);border-color:rgba(200,16,46,0.2)}
  .decision-card.approve-card:hover{border-color:var(--green);background:rgba(26,122,58,0.1)}
  .decision-card.reject-card:hover{border-color:var(--red);background:rgba(200,16,46,0.08)}
  .decision-icon{font-size:32px;margin-bottom:10px}
  .decision-title{font-family:var(--font-cond);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  .approve-card .decision-title{color:var(--green)}
  .reject-card .decision-title{color:var(--red)}
  .decision-desc{font-size:13px;color:rgba(10,22,40,0.6);line-height:1.65;margin-bottom:16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-family:var(--font-cond);font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:rgba(10,22,40,0.5);margin-bottom:5px}
  .field input,.field textarea{width:100%;padding:10px 13px;border:1.5px solid rgba(10,22,40,0.15);border-radius:6px;font-size:14px;font-family:var(--font-body);color:var(--navy);transition:border-color 0.2s;background:#fff}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--navy)}
  .field input.err,.field textarea.err{border-color:var(--red)}
  .field-err{font-size:12px;color:var(--red);margin-top:4px;display:none}
  .field-err.show{display:block}
  .field textarea{resize:vertical;min-height:90px}
  .btn-approve{width:100%;background:var(--green);color:#fff;border:none;padding:13px;border-radius:7px;font-family:var(--font-cond);font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:background 0.2s}
  .btn-approve:hover{background:#145e2e}
  .btn-reject{width:100%;background:var(--red);color:#fff;border:none;padding:13px;border-radius:7px;font-family:var(--font-cond);font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:background 0.2s}
  .btn-reject:hover{background:#9e0d23}
  .btn:disabled{opacity:0.5;cursor:not-allowed}
  .already-done{text-align:center;padding:48px 24px}
  .done-icon{font-size:56px;margin-bottom:16px}
  .done-title{font-family:var(--font-display);font-size:32px;letter-spacing:2px;margin-bottom:8px}
  .done-sub{font-size:15px;color:rgba(10,22,40,0.55);line-height:1.7;max-width:420px;margin:0 auto}
  .loading{text-align:center;padding:64px 24px;color:rgba(10,22,40,0.4);font-family:var(--font-cond);font-size:15px;letter-spacing:1px;text-transform:uppercase}
  @media(max-width:600px){.decision-section{grid-template-columns:1fr}.items-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-icon">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2L8 8H4l4 4-1.5 6L12 15l5.5 3L16 12l4-4h-4L12 2z"/></svg>
  </div>
  <div class="topbar-brand" id="topbarBrand">Rocket City Banner</div>
</div>

<div class="container">
  <div id="loadingState" class="loading">Loading your proof...</div>
  <div id="mainContent" style="display:none;"></div>
</div>

<script>
const BACKEND = window.RCB_BACKEND_URL || '';
const token   = location.pathname.split('/proof/')[1]?.split('/')[0];

window.addEventListener('DOMContentLoaded', async () => {
  await loadBrand();
  if (!token) {
    showError('Invalid proof link. Please use the link from your email.');
    return;
  }
  await loadProof();
});

async function loadBrand() {
  try {
    const res = await fetch(`${BACKEND}/api/tenant/config`);
    if (!res.ok) return;
    const cfg = await res.json();
    document.title = `Proof Review — ${cfg.name}`;
    document.getElementById('topbarBrand').textContent = cfg.name;
    if (cfg.colors?.primary) document.documentElement.style.setProperty('--red', cfg.colors.primary);
  } catch(e) {}
}

async function loadProof() {
  try {
    const res  = await fetch(`${BACKEND}/api/proof/${token}`);
    const data = await res.json();
    document.getElementById('loadingState').style.display = 'none';
    if (!res.ok) { showError(data.error || 'Proof not found.'); return; }
    renderProof(data);
    document.getElementById('mainContent').style.display = 'block';
  } catch(e) {
    showError('Network error. Please try again.');
  }
}

function renderProof(d) {
  const mc = document.getElementById('mainContent');

  if (d.proofStatus === 'approved') {
    mc.innerHTML = `<div class="card"><div class="already-done">
      <div class="done-icon">✅</div>
      <div class="done-title" style="color:var(--green)">PROOF APPROVED</div>
      <p class="done-sub">You already approved this proof${d.approvedBy ? ` as <strong>${d.approvedBy}</strong>` : ''}. Your order is in production!</p>
      <a href="/track?order=${d.orderNumber}" style="display:inline-block;margin-top:20px;color:var(--red);font-family:var(--font-cond);font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;">Track Your Order →</a>
    </div></div>`;
    return;
  }

  if (d.proofStatus === 'changes_requested') {
    mc.innerHTML = `<div class="card"><div class="already-done">
      <div class="done-icon">🔄</div>
      <div class="done-title" style="color:var(--red)">CHANGES REQUESTED</div>
      <p class="done-sub">Our team received your change request and is working on a revised proof. We'll email you when it's ready.</p>
    </div></div>`;
    return;
  }

  const itemsHtml = (d.items||[]).map(i => `
    <div class="item-card">
      <div class="item-name">${esc(i.name)}</div>
      <div class="item-detail">
        ${esc(i.materialName)}<br>
        ${i.width}"×${i.height}" · Qty ${i.qty}<br>
        ${i.grommet ? 'Grommets: ' + i.grommet.replace(/_/g,' ') + '<br>' : ''}
        ${i.date ? 'In-hands: ' + i.date : ''}
        ${(i.fileNames||[]).length ? '<br>File: ' + i.fileNames.join(', ') : ''}
      </div>
    </div>`).join('');

  const previewHtml = d.previewImageUrl
    ? `<div class="preview-area"><div class="preview-badge">⚠ LOW-RES PREVIEW ONLY — Not final print quality</div><img src="${d.previewImageUrl}" class="preview-img" alt="Artwork preview"></div>`
    : `<div class="preview-area"><div class="preview-empty-icon">🖼️</div><div class="preview-empty-text">Artwork preview not available for this proof.<br>Please review your original files.</div></div>`;

  mc.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-title">Proof Review</div>
        <div class="card-sub">Please review your artwork carefully before approving.</div>
      </div>
      <div class="card-body">
        <div class="order-pill">
          <span style="font-family:var(--font-cond);font-size:12px;color:rgba(10,22,40,0.5);text-transform:uppercase;letter-spacing:1px;">Order</span>
          <span class="order-num">${d.orderNumber}</span>
        </div>
        ${d.proofNotes ? `<div class="notes-box"><div class="notes-title">Notes from our team</div>${esc(d.proofNotes)}</div>` : ''}
        ${previewHtml}
        <div style="background:rgba(200,16,46,0.05);border:1px solid rgba(200,16,46,0.15);border-radius:6px;padding:12px 16px;margin-bottom:20px;">
          <strong style="font-size:13px;color:var(--red);">⚠ Important:</strong>
          <span style="font-size:13px;color:rgba(10,22,40,0.65);"> This is a low-resolution screen preview only. Final print quality will be significantly sharper. Please verify content, spelling, and layout before approving.</span>
        </div>
        <div class="notes-title" style="margin-bottom:12px;">Your Order Items</div>
        <div class="items-grid">${itemsHtml}</div>
        <hr class="divider">
        <div class="notes-title" style="margin-bottom:16px;">Your Decision</div>
        <div class="decision-section">
          <div class="decision-card approve-card">
            <div class="decision-icon">✅</div>
            <div class="decision-title">Approve Proof</div>
            <div class="decision-desc">Everything looks correct. Approve to move your order into production.</div>
            <div class="field">
              <label>Your Full Name <span style="color:var(--red)">*</span></label>
              <input type="text" id="approvedBy" placeholder="Jane Smith">
              <div class="field-err" id="approvedByErr">Please enter your full name</div>
            </div>
            <button class="btn-approve" onclick="submitApproval()">✅ I Approve This Proof</button>
          </div>
          <div class="decision-card reject-card">
            <div class="decision-icon">🔄</div>
            <div class="decision-title">Request Changes</div>
            <div class="decision-desc">Something needs to be corrected. Describe the changes and we'll revise and resend.</div>
            <div class="field">
              <label>Changes Needed <span style="color:var(--red)">*</span></label>
              <textarea id="rejectionNotes" placeholder="Please describe exactly what needs to change..."></textarea>
              <div class="field-err" id="rejectionNotesErr">Please describe the changes needed</div>
            </div>
            <button class="btn-reject" onclick="submitRejection()">🔄 Request Changes</button>
          </div>
        </div>
      </div>
    </div>
    <div style="text-align:center;font-size:13px;color:rgba(10,22,40,0.4);margin-top:8px;">
      Questions? Contact us at <a href="mailto:orders@rocketcitybanner.com" style="color:var(--red);font-weight:600;">orders@rocketcitybanner.com</a>
    </div>`;
}

async function submitApproval() {
  const name = document.getElementById('approvedBy')?.value.trim();
  const err  = document.getElementById('approvedByErr');
  if (!name) { err.classList.add('show'); return; }
  err.classList.remove('show');
  await submitDecision('approve', { approvedBy: name });
}

async function submitRejection() {
  const notes = document.getElementById('rejectionNotes')?.value.trim();
  const err   = document.getElementById('rejectionNotesErr');
  if (!notes) { err.classList.add('show'); return; }
  err.classList.remove('show');
  await submitDecision('reject', { rejectionNotes: notes });
}

async function submitDecision(action, payload) {
  const btn = document.querySelector(action === 'approve' ? '.btn-approve' : '.btn-reject');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting...'; }
  try {
    const res  = await fetch(`${BACKEND}/api/proof/${token}/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || 'An error occurred. Please try again.'); if(btn){btn.disabled=false;btn.textContent=action==='approve'?'✅ I Approve This Proof':'🔄 Request Changes';} return; }

    document.getElementById('mainContent').innerHTML = `
      <div class="card"><div class="already-done">
        <div class="done-icon">${action === 'approve' ? '✅' : '🔄'}</div>
        <div class="done-title" style="color:${action==='approve'?'var(--green)':'var(--red)'}">
          ${action === 'approve' ? 'PROOF APPROVED!' : 'CHANGES REQUESTED'}
        </div>
        <p class="done-sub">${data.message}</p>
        ${action === 'approve' ? `<a href="/track?order=${location.pathname.split('/')[2]||''}" style="display:inline-block;margin-top:20px;color:var(--red);font-family:var(--font-cond);font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;">Track Your Order →</a>` : ''}
      </div></div>`;
  } catch(e) {
    alert('Network error. Please try again.');
    if(btn){btn.disabled=false;}
  }
}

function showError(msg) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
  document.getElementById('mainContent').innerHTML = `<div class="card"><div class="already-done">
    <div class="done-icon">❌</div>
    <div class="done-title">Link Error</div>
    <p class="done-sub">${msg}</p>
    <a href="/" style="display:inline-block;margin-top:20px;color:var(--red);font-family:var(--font-cond);font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;">← Back to Store</a>
  </div></div>`;
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script>
</body>
</html>
